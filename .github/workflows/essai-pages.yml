# Temporaire : vérifie si GitHub Pages peut être activé par le workflow.
name: Essai activation Pages
on:
  push:
    branches: [plateforme-emploi]
    paths: ['.github/workflows/essai-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
